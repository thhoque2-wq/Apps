name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - name: Create project files
        run: |
          cat > settings.gradle.kts <<'__END__'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "DouyinDownloader"
          include(":app")
          __END__
          cat > build.gradle.kts <<'__END__'
          plugins {
              id("com.android.application") version "8.7.3" apply false
              id("org.jetbrains.kotlin.android") version "2.0.21" apply false
              id("org.jetbrains.kotlin.plugin.compose") version "2.0.21" apply false
          }
          __END__
          cat > gradle.properties <<'__END__'
          org.gradle.jvmargs=-Xmx2g
          android.useAndroidX=true
          kotlin.code.style=official
          __END__
          mkdir -p app
          cat > app/build.gradle.kts <<'__END__'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
              id("org.jetbrains.kotlin.plugin.compose")
          }

          android { namespace = "com.example.douyindownloader"; compileSdk = 35
              defaultConfig { applicationId = "com.example.douyindownloader"; minSdk = 26; targetSdk = 35; versionCode = 1; versionName = "1.0" }
          }
          dependencies {
              implementation("androidx.core:core-ktx:1.15.0")
              implementation("androidx.activity:activity-compose:1.10.0")
              implementation(platform("androidx.compose:compose-bom:2025.01.00"))
              implementation("androidx.compose.ui:ui")
              implementation("androidx.compose.ui:ui-tooling-preview")
              implementation("androidx.compose.material3:material3")
              implementation("androidx.lifecycle:lifecycle-runtime-ktx:2.8.7")
          }
          __END__
          mkdir -p app/src/main
          cat > app/src/main/AndroidManifest.xml <<'__END__'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET"/>
              <application android:theme="@style/Theme.DouyinDownloader" android:label="Douyin Downloader" android:usesCleartextTraffic="false">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                      <intent-filter>
                          <action android:name="android.intent.action.SEND"/>
                          <category android:name="android.intent.category.DEFAULT"/>
                          <data android:mimeType="text/plain"/>
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          __END__
          mkdir -p app/src/main/res/values
          cat > app/src/main/res/values/styles.xml <<'__END__'
          <resources>
          <style name="Theme.DouyinDownloader" parent="android:style/Theme.Material.NoActionBar">
              <item name="android:fontFamily">sans</item>
              <item name="android:windowLightStatusBar">false</item>
              <item name="android:statusBarColor">#0B0B0F</item>
              <item name="android:navigationBarColor">#0B0B0F</item>
          </style>
          </resources>
          __END__
          mkdir -p app/src/main/java/com/example/douyindownloader
          cat > app/src/main/java/com/example/douyindownloader/MainActivity.kt <<'__END__'
          package com.example.douyindownloader

          import android.content.Intent
          import android.os.Bundle
          import android.widget.Toast
          import androidx.activity.ComponentActivity
          import androidx.activity.compose.setContent
          import androidx.compose.foundation.layout.*
          import androidx.compose.foundation.shape.RoundedCornerShape
          import androidx.compose.material3.*
          import androidx.compose.runtime.*
          import androidx.compose.ui.Modifier
          import androidx.compose.ui.graphics.Color
          import androidx.compose.ui.unit.dp
          import androidx.compose.ui.unit.sp

          class MainActivity : ComponentActivity() {
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  val incoming = intent?.getStringExtra(Intent.EXTRA_TEXT).orEmpty()
                  setContent { DownloaderScreen(incoming) }
              }
          }

          private fun extractDouyinUrl(text: String): String? {
              val regex = Regex("""https?://v\.douyin\.com/[A-Za-z0-9_-]+/?""")
              return regex.find(text)?.value
          }

          @Composable
          fun DownloaderScreen(initialText: String) {
              val context = androidx.compose.ui.platform.LocalContext.current
              var text by remember { mutableStateOf(initialText) }
              var url by remember { mutableStateOf(extractDouyinUrl(initialText)) }

              MaterialTheme(
                  colorScheme = darkColorScheme(
                      background = Color(0xFF0B0B0F),
                      surface = Color(0xFF15151C),
                      primary = Color(0xFF8B7CFF)
                  )
              ) {
                  Surface(Modifier.fillMaxSize()) {
                      Column(
                          Modifier.fillMaxSize().padding(20.dp),
                          verticalArrangement = Arrangement.spacedBy(16.dp)
                      ) {
                          Text("Douyin Downloader", fontSize = 28.sp, color = Color.White)
                          Text("Paste complete Douyin share text or a v.douyin.com link.",
                              color = Color.LightGray)

                          OutlinedTextField(
                              value = text,
                              onValueChange = { text = it; url = extractDouyinUrl(it) },
                              modifier = Modifier.fillMaxWidth().height(180.dp),
                              placeholder = { Text("4.84 复制打开抖音... https://v.douyin.com/...") },
                              shape = RoundedCornerShape(18.dp)
                          )

                          Button(
                              onClick = {
                                  url = extractDouyinUrl(text)
                                  if (url == null) {
                                      Toast.makeText(
                                          context,
                                          "Douyin link not found",
                                          Toast.LENGTH_SHORT
                                      ).show()
                                  }
                              },
                              modifier = Modifier.fillMaxWidth().height(54.dp),
                              shape = RoundedCornerShape(16.dp)
                          ) { Text("Detect Douyin Link") }

                          if (url != null) {
                              Card(Modifier.fillMaxWidth(), shape = RoundedCornerShape(18.dp)) {
                                  Column(Modifier.padding(16.dp)) {
                                      Text("Detected link", color = Color.Gray)
                                      Spacer(Modifier.height(6.dp))
                                      Text(url!!, color = Color.White)
                                      Spacer(Modifier.height(14.dp))
                                      Text(
                                          "Downloader engine is ready for an authorized resolver/API. " +
                                          "This app does not bypass Douyin security or access controls.",
                                          color = Color(0xFFFFCC80), fontSize = 13.sp
                                      )
                                  }
                              }
                          }

                          Spacer(Modifier.weight(1f))
                          Text(
                              "Use only videos you have permission to download.",
                              color = Color.Gray, fontSize = 12.sp
                          )
                      }
                  }
              }
          }
          __END__
      - name: Build debug APK
        run: gradle assembleDebug --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: DouyinDownloader-apk
          path: app/build/outputs/apk/debug/*.apk
